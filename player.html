  #name{font-size:1.7em;font-weight:600}#place{font-size:1.15em;opacity:.9}

  #clock{font-size:2.6em;font-weight:300;font-variant-numeric:tabular-nums;margin-top:.15em}
  #date{font-size:1em;opacity:.85;text-transform:capitalize}
  #btn{position:fixed;top:2.5vh;left:50%;transform:translateX(-50%);padding:.7em 1.4em;border:0;border-radius:999px;
    background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;opacity:.35;transition:opacity .2s}
  #btn:hover{opacity:1;background:rgba(0,0,0,.8)}
  #status{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#fc6;font-size:14px;

</style>

const cfg = { quality:'hd1080', interval:10, shuffle:true, volume:0, zoom:100, showInfo:true, showCoords:true,
  h24:true, infoPos:'bl', infoSize:100, infoOpacity:55, infoColor:'#ffffff', showButton:true };
const $ = id => document.getElementById(id);
let player, order=[], pos=-1, timer=null, errCount=0, current=null, ready=false, started=false, gotInit=false, waited=false;

function buildOrder(){
  order = CAMERAS.map((_, i) => i);
  if (cfg.shuffle) for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  pos = -1;
}
function showStatus(t){ const s=$('status'); s.textContent=t; s.style.display=t?'block':'none'; }
function next(){
  clearTimeout(timer);
  pos++; if (pos>=order.length){ buildOrder(); pos=0; }
  current = CAMERAS[order[pos]];
  const o = { videoId: current.id };
  if (cfg.quality!=='auto') o.suggestedQuality = cfg.quality;
  player.loadVideoById(o);
  renderInfo();
  timer = setTimeout(next, cfg.interval*60000);
}
function onError(e){
  errCount++;
  showStatus(`Erreur YouTube ${e.data} sur « ${current?current.name:'?'} » — caméra suivante…`);
  clearTimeout(timer);
  if (errCount>=CAMERAS.length){
    showStatus(`Toutes les caméras échouent (dernier code ${e.data}). Nouvel essai dans 60 s.`);
    timer = setTimeout(()=>{ errCount=0; showStatus(''); next(); }, 60000);
  } else timer = setTimeout(next, 2500);
}
function onState(e){
  if (e.data===YT.PlayerState.PLAYING){
    errCount=0; showStatus(''); applyAudio();
    if (cfg.quality!=='auto') try{ player.setPlaybackQuality(cfg.quality); }catch(_){}
  } else if (e.data===YT.PlayerState.ENDED) next();
}
function applyAudio(){
  if (!ready) return;
  if (cfg.volume>0){ player.setVolume(cfg.volume); player.unMute(); } else player.mute();
}
function maybeStart(){
  if (ready && !started && (gotInit || waited)){ started=true; buildOrder(); next(); }
}
window.onYouTubeIframeAPIReady = function(){
  const vars = { autoplay:1, controls:0, mute:1, modestbranding:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, playsinline:1 };
  if (location.origin.startsWith('http')) vars.origin = location.origin;
  player = new YT.Player('player', { width:'100%', height:'100%', playerVars:vars,
    events:{ onReady:()=>{ ready=true; maybeStart(); }, onError, onStateChange:onState } });
};
const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
setTimeout(()=>{ waited=true; maybeStart(); }, 2500);

/* ----- bandeau ----- */
const fc=(v,p,n)=>Math.abs(v).toFixed(4)+'° '+(v>=0?p:n);
function renderInfo(){
  const c=current, i=$('info');
  i.style.display = cfg.showInfo?'block':'none';
  i.className = cfg.infoPos;
  i.style.fontSize = (1.1*cfg.infoSize/100)+'vw';
  i.style.background = `rgba(0,0,0,${cfg.infoOpacity/100})`;
  i.style.color = cfg.infoColor;
  $('wrap').style.transform = `scale(${cfg.zoom/100})`;
  $('btn').style.display = cfg.showButton?'block':'none';
  if(!c) return;
  $('name').textContent = c.name;
  $('place').textContent = [c.place,c.country].filter(Boolean).join(' — ');
  const hasC = typeof c.lat==='number' && typeof c.lon==='number';
  $('coords').style.display = (cfg.showCoords&&hasC)?'block':'none';
  if(hasC) $('coords').textContent = '📍 '+fc(c.lat,'N','S')+', '+fc(c.lon,'E','W');
  tick();
}
function tick(){
  const c=current; if(!c) return;
  const now=new Date(), tz=c.tz||undefined;
  try{
    const t=new Intl.DateTimeFormat('fr-FR',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!cfg.h24}).format(now);
    const d=new Intl.DateTimeFormat('fr-FR',{timeZone:tz,weekday:'long',day:'numeric',month:'long'}).format(now);
    const h=+new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'numeric',hourCycle:'h23'}).format(now);
    const off=new Intl.DateTimeFormat('en-GB',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName');
    $('clock').textContent = ((h>=7&&h<20)?'☀️ ':'🌙 ')+t;
    $('date').textContent = c.tz ? `${d} (${off?off.value:c.tz})` : `${d} (heure de ton PC)`;
  }catch(_){ $('clock').textContent=''; }
}
setInterval(tick,1000);

/* ----- bouton / clavier ----- */
$('btn').addEventListener('click', ()=>{ if(started) next(); });
addEventListener('keydown', e=>{ if(started && (e.key==='n'||e.key==='N'||e.key==='ArrowRight')) next(); });

/* ----- messages venant de Wallpaper Engine (la coque locale) ----- */
function applyCfg(n){
  const oldShuffle=cfg.shuffle, oldQ=cfg.quality, oldInt=cfg.interval;
  Object.assign(cfg,n);
  renderInfo(); applyAudio();
  if(!started) return;
  if(cfg.shuffle!==oldShuffle){ const cur=current; buildOrder(); const k=order.indexOf(CAMERAS.indexOf(cur)); if(k>=0) pos=k; }
  if(cfg.quality!==oldQ) try{ player.setPlaybackQuality(cfg.quality==='auto'?'default':cfg.quality); }catch(_){}
  if(cfg.interval!==oldInt){ clearTimeout(timer); timer=setTimeout(next,cfg.interval*60000); }
}
addEventListener('message', e=>{
  const m=e.data; if(!m||typeof m!=='object') return;
  if(m.type==='init'){
    if(Array.isArray(m.cameras)&&m.cameras.length) CAMERAS=m.cameras;
    Object.assign(cfg,m.cfg||{}); gotInit=true; renderInfo();
    if(started){ buildOrder(); next(); } else maybeStart();
  } else if(m.type==='cfg') applyCfg(m.cfg||{});
  else if(m.type==='next' && started) next();
});

/* ----- caméras passées par l'adresse (?c=...) ----- */
try{
  const c=new URLSearchParams(location.search).get('c');
  if(c){ const list=JSON.parse(decodeURIComponent(escape(atob(c)))); if(Array.isArray(list)&&list.length){ CAMERAS=list; gotInit=true; } }
}catch(_){}

/* ----- propriétés Wallpaper Engine (le fond d'écran ouvre directement cette page) ----- */
const rgb=v=>{const p=v.split(' ').map(x=>Math.round(parseFloat(x)*255));return `rgb(${p[0]},${p[1]},${p[2]})`;};
let firstProps=true, lastNext;
window.wallpaperPropertyListener={ applyUserProperties(p){
  const d={};
  ['quality','interval','shuffle','volume','zoom','showInfo','showCoords','h24','infoPos','infoSize','infoOpacity','showButton']
    .forEach(k=>{ if(p[k]) d[k]=p[k].value; });
  if(p.infoColor) d.infoColor=rgb(p.infoColor.value);
  applyCfg(d);
  if(p.nextCam){ if(!firstProps && p.nextCam.value!==lastNext && started) next(); lastNext=p.nextCam.value; }
  firstProps=false;
}};
renderInfo();
</script>
</body>
</html>
